apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-dashboard-setup
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: financial-agent
    app.kubernetes.io/component: observability-setup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kibana-dashboard-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dashboard-importer
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kibana service to be ready..."
              until curl -s http://kibana-service.logging.svc.cluster.local:8084/api/status | grep -q "available"; do
                echo "Kibana not yet ready, retrying in 3s..."
                sleep 3
              done
              echo "Kibana is healthy! Importing Financial Analyst LLMOps Dashboard..."
              RESPONSE=$(curl -s -X POST "http://kibana-service.logging.svc.cluster.local:8084/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                --form file=@/config/dashboard.ndjson)
              echo "Kibana Import Response: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"success":true'; then
                echo "Successfully imported Financial Analyst LLMOps Dashboard into Kibana!"
                exit 0
              else
                echo "Import failed or returned warning."
                exit 1
              fi
          volumeMounts:
            - name: manifest-volume
              mountPath: /config
      volumes:
        - name: manifest-volume
          configMap:
            name: kibana-dashboard-manifest
