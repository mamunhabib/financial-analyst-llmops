---
# ------------------------------------------------------------------------------
# Langfuse Web UI & API Server Deployment
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: observability-ui
    app.kubernetes.io/part-of: llmops-financial-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      containers:
        - name: langfuse-server
          image: langfuse/langfuse:2
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql://langfuse:langfuse_dev_secret@langfuse-postgres:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "http://localhost:8092"
            - name: NEXTAUTH_SECRET
              value: "7f1e6b8a9c3d4e5f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f"
            - name: SALT
              value: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 15

---
# ------------------------------------------------------------------------------
# Langfuse LoadBalancer Service (Exposed externally on :8092)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: observability-ui
    app.kubernetes.io/part-of: llmops-financial-analyst
spec:
  type: LoadBalancer
  ports:
    - name: http-external
      port: 8092
      targetPort: 3000
    - name: http-internal
      port: 3000
      targetPort: 3000
  selector:
    app: langfuse
