apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-gateway
  namespace: financial-agent
  labels:
    app: market-gateway
    app.kubernetes.io/name: market-gateway
    app.kubernetes.io/part-of: llmops-financial-analyst
    app.kubernetes.io/component: market-feed-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: market-gateway
        app.kubernetes.io/name: market-gateway
        app.kubernetes.io/part-of: llmops-financial-analyst
    spec:
      imagePullSecrets:
        - name: git-secret
      containers:
        - name: market-gateway
          image: ghcr.io/mamunhabib/financial-analyst-agent/market-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-feed
              containerPort: 8004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: market-gateway
  namespace: financial-agent
  labels:
    app: market-gateway
    app.kubernetes.io/name: market-gateway
    app.kubernetes.io/part-of: llmops-financial-analyst
spec:
  type: ClusterIP
  selector:
    app: market-gateway
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP
